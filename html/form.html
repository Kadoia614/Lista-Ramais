
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Funcionários</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top-header">
      <div class="header-content">
        <img src="/img/logo.jfif" class="logo" />
        <h1>Prefeitura de Itapecerica da Serra</h1>
        <h2><a href="/login.html">Sair</a></h2>
      </div>
    </header>

    <header>
      <h1>Cadastro de Ramais</h1>
      <button id="btnNovo">+ Novo Funcionário</button>
    </header>

    <div style="margin: 15px 0">
      <input
        type="text"
        id="busca"
        placeholder="Buscar por nome, setor ou ramal..."
        style="width: 98%; padding: 10px; font-size: 16px; border-radius: 4px"
      />
    </div>

    <div id="formContainer" class="hidden">
      <h2 id="formTitle">Novo Funcionário</h2>

      <input type="text" id="nome" placeholder="Nome" />
      <input type="text" id="setor" placeholder="Setor" />
      <input type="text" id="ramal" placeholder="Ramal" />

      <button id="salvar">Salvar</button>
      <button id="cancelar">Cancelar</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Setor</th>
          <th>Ramal</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>

    <script src="script.js"></script>
  </body>
</html>
